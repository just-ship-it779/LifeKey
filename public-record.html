<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeKey — Medical Record</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Extra styles specific to the public record page */
    .pub-header {
      background: var(--navy);
      padding: 1rem 0;
    }
    .pub-header-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .pub-header-inner svg { color: #99f6e4; }

    .pub-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .pub-profile-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .pub-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: .35rem;
    }
    .pub-blood {
      display: inline-block;
      font-size: 1rem;
      font-weight: 800;
      color: var(--white);
      background: var(--teal-dark);
      padding: .25rem .75rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
    }
    .pub-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .85rem 1.5rem;
    }
    .pub-field label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--teal);
    }
    .pub-field p {
      font-size: .9rem;
      color: var(--text);
      margin-top: .15rem;
    }

    .pub-field-full { grid-column: 1 / -1; }

    .pub-section-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
      margin: 2rem 0 1rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .pub-report-count {
      font-size: .75rem;
      font-weight: 700;
      background: var(--teal-mid);
      color: var(--teal-dark);
      padding: .15rem .55rem;
      border-radius: 99px;
    }
    .pub-no-reports {
      color: var(--muted);
      font-size: .9rem;
      padding: 1rem 0;
    }

    /* Loading + error states */
    .pub-loading, .pub-error {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .pub-error { color: var(--error); }

    /* Report list on the public page */
    .pub-report-item {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: .75rem;
    }
    .pub-report-icon {
      width: 40px; height: 40px;
      background: var(--surface-alt);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .pub-report-icon svg { width: 18px; height: 18px; color: var(--teal); }
    .pub-report-info { flex: 1; }
    .pub-report-type { font-weight: 700; color: var(--navy); font-size: .9rem; }
    .pub-report-meta { font-size: .78rem; color: var(--muted); margin-top: .15rem; }

    @media (max-width: 560px) {
      .pub-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="pub-header">
    <div class="pub-header-inner">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 11H5m7-7v14"/><rect x="3" y="3" width="18" height="18" rx="3"/>
      </svg>
      LifeKey — Public Medical Record
    </div>
  </header>

  <!-- Main content -->
  <main class="pub-main">

    <!-- Content is injected here by public-record.js -->
    <div id="pub-content">
      <div class="pub-loading">
        <p>Loading medical record…</p>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="public-record.js"></script>

</body>
</html>
